<section id="contact" class="border-t border-line">
  <div class="mx-auto max-w-6xl px-5 py-24">
    <h2 class="font-display text-4xl leading-tight font-bold sm:text-5xl">Hiring an Angular developer in Bengaluru?</h2>
    <p class="mt-5 max-w-xl text-lg text-muted">{{ profile.openTo }}</p>
    <p class="mt-3 text-lg">
      <a [href]="'mailto:' + profile.email" class="text-accent underline underline-offset-4">{{ profile.email }}</a>
    </p>
    <div class="mt-9 flex flex-wrap gap-3">
      <a [href]="'mailto:' + profile.email" class="rounded-lg bg-accent px-5 py-3 font-semibold text-white hover:opacity-90">Email me</a>
      <a [href]="profile.linkedin" target="_blank" rel="noopener" class="rounded-lg border border-line px-5 py-3 font-semibold hover:border-muted">LinkedIn</a>
      <a [href]="profile.github" target="_blank" rel="noopener" class="rounded-lg border border-line px-5 py-3 font-semibold hover:border-muted">GitHub</a>
    </div>
  </div>
</section>
